  # Simple workflow for deploying static content via rsync/SSH
name: Deploy Fallback Content via rsync

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']
  # Runs twice per day (UTC)
  schedule:
    - cron: '0 3,15 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:

jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
          VITE_ARKHAMESQUE_URL: ${{ secrets.VITE_ARKHAMESQUE_URL }}
      - name: Build
        run: npm run build
        env:
          APP_BASE_PATH: ${{ secrets.APP_BASE_PATH }}
          DATA_URL: ${{ secrets.DATA_URL }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_INVESTIGATORS_URL: ${{ secrets.VITE_INVESTIGATORS_URL }}
          VITE_ARKHAMESQUE_URL: ${{ secrets.VITE_ARKHAMESQUE_URL }}
          VITE_ARKHAM_INDEX_URL: ${{ secrets.VITE_ARKHAM_INDEX_URL }}
          
      - name: 📂 Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # Variable RSYNC_EXCLUDE. Example: docs/deploy-fallback.md
      - name: 📂 Write rsync exclude rules from variable
        env:
          RSYNC_EXCLUDE_FROM: ${{ vars.RSYNC_EXCLUDE }}
        run: |
          mkdir -p .github
          printf '%s\n' "$RSYNC_EXCLUDE_FROM" > .github/.rsync-exclude

      - name: 📂 Sync files via rsync
        run: |
          RSH="ssh -p ${{ secrets.SSH_PORT || 22 }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          DEST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_DIR }}"
          sshpass -p '${{ secrets.SSH_PASSWORD }}' rsync -avz --delete \
            --exclude-from=.github/.rsync-exclude \
            -e "$RSH" \
            ./dist/ \
            "$DEST"
          # Vite's hashed bundles live in dist/assets. RSYNC_EXCLUDE must not be able
          # to skip them: a missing module is served as index.html and fails MIME checks.
          sshpass -p '${{ secrets.SSH_PASSWORD }}' rsync -avz --delete \
            -e "$RSH" \
            ./dist/assets/ \
            "$DEST/assets/"

      - name: Verify entry bundle on server
        run: |
          entry=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)
          test -n "$entry"
          test -s "dist/$entry"
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -p "${{ secrets.SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "test -s '${{ secrets.SSH_DIR }}/$entry'"