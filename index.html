<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <!-- Icon for light theme -->
    <link rel="icon" href="/favicon.ico" media="(prefers-color-scheme: light)">

    <!-- Icon for dark theme -->
    <link rel="icon" href="/favicon-dark.ico?v=0.1" media="(prefers-color-scheme: dark)">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Divider" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkham Divider</title>
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <!-- coi -->
    <style>
      body {
        margin: 0;
      }
      .loader {
        position: fixed;
        inset: 0;
        background-color: #eeeef1;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .loader__image {
        display: block;
        object-fit: contain;
        max-width: min(500px, 100%);
        max-height: 100%;
        width: auto;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader">
        <!--
          This is the first screen, painted before any JS runs, so its weight is on the
          critical path. The WebP is 104 KB against 321 KB for the GIF; the GIF stays as a
          fallback and is never fetched by a browser that understands WebP.
        -->
        <picture>
          <source srcset="/images/loader.webp" type="image/webp" />
          <img src="/images/loader.gif" class="loader__image" alt="" />
        </picture>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
